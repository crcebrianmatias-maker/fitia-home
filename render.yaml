services:
  - type: web
    name: fitia-home
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: FITIA_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
